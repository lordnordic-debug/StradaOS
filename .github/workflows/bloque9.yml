name: Bloque 9 (capturas)

# Compila la rama y toma capturas de la 2.21 en emuladores: ventanas propias, diagnósticos traducidos, copia de
# seguridad, francés y diseño vertical (768x1024 y 1080x1920). Quedan en la rama «bloque9-capturas».
on:
  workflow_dispatch:
  push:
    branches: [ 'wip-**' ]
    paths: [ 'app/**', '.github/workflows/bloque9.yml', '.github/scripts/bloque9.sh' ]

permissions:
  contents: write

concurrency:
  group: bloque9
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/*.apk app-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-prueba.apk

  emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 16, arch: x86 }
          - { api: 23, arch: x86 }
          - { api: 30, arch: x86_64 }
          - { api: 34, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/bloque9.sh ${{ matrix.api }} app-prueba.apk capturas/api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bloque9-api${{ matrix.api }}
          path: capturas/

  publicar:
    needs: emulador
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bloque9-*
          path: out
          merge-multiple: true
      - name: Subir capturas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          echo "# Bloque 9 · ${GITHUB_SHA::7}" > README.md
          git init -q -b bloque9-capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas bloque 9 (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bloque9-capturas
