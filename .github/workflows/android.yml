name: Compilar (debug)

# Compila la versión de prueba («StradaOS Prueba», paquete com.stradaos.launcher.debug) en cada push.
# En main (o al lanzarlo a mano desde una rama) la publica en el Release «prueba» (prerelease, no cuenta como versión nueva) para instalarla en un
# celular o en la pantalla junto a la normal. Se firma con la llave de siempre, así cada prueba se instala encima.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'fastlane/**', 'changelogs/**', 'update.json', '.github/ISSUE_TEMPLATE/**', '.github/FUNDING.yml', 'site/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Llave de firma (si está disponible)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STRADAOS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK de prueba
        env:
          STRADAOS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STRADAOS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STRADAOS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StradaOS-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar en el Release «prueba»
        # en main al hacer push, o a mano desde cualquier rama (para probar una versión antes de publicarla)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk StradaOS-prueba.apk
          SHORT=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          NOTES=$(printf 'Versión de prueba de StradaOS (se instala junto a la normal como «StradaOS Prueba»).\n\nCompilada del commit %s: %s\n\nNo avisa actualizaciones: vuelve a esta página o usa el enlace fijo:\nhttps://github.com/%s/releases/download/prueba/StradaOS-prueba.apk' "$SHORT" "$MSG" "$GITHUB_REPOSITORY")
          git tag -f prueba
          git push -f origin refs/tags/prueba
          if gh release view prueba >/dev/null 2>&1; then
            gh release upload prueba StradaOS-prueba.apk --clobber
            gh release edit prueba --title "Prueba · $SHORT" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create prueba StradaOS-prueba.apk --title "Prueba · $SHORT" --notes "$NOTES" --prerelease --latest=false
          fi
